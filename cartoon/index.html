<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#d4c4f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🏠%3C/text%3E%3C/svg%3E" />
  <title>美式卡通 · 实时卧室</title>
  <link rel="stylesheet" href="../common.css" />
  <style>
    :root { --panel: rgba(42,24,64,.66); --border: rgba(255,204,136,.4); --accent: #ffcc88; --active: rgba(224,80,120,.85); }
    html, body { background: #d4c4f0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="topbar">
    <a class="pill" href="../">‹ 返回</a>
    <div id="hud" class="pill" onclick="this.classList.toggle('open')">
      <div><b>美式卡通 · Toon</b><span class="caret">ⓘ</span></div>
      <div class="more">单指拖动旋转 · 双指缩放/平移<br/><span id="fps">--</span> fps</div>
    </div>
  </div>
  <div class="toolbar">
    <button id="bOutline" class="active"><span class="ico">✎</span><span class="lbl">描边 开</span></button>
    <button id="bSteps"><span class="ico">▤</span><span class="lbl">色阶 3</span></button>
    <button id="bDayNight"><span class="ico">☀︎</span><span class="lbl">日间</span></button>
    <button id="bOrbit"><span class="ico">↻</span><span class="lbl">绕转</span></button>
    <button id="bReset"><span class="ico">⌂</span><span class="lbl">重置</span></button>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
